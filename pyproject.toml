[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-homelab"
version = "0.2.0"
description = "Read-only infrastructure intelligence for self-hosted homelabs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Aashir Javed"}]
keywords = ["homelab", "self-hosted", "proxmox", "docker", "observability"]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/aashirjaved/agentic-homelab"
Issues = "https://github.com/aashirjaved/agentic-homelab/issues"

[project.scripts]
homelab = "agentic_homelab.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_homelab*"]
