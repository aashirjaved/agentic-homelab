homelab:
  name: example-lab
  owner: you
nodes:
  - id: pve-01
    role: proxmox
    address: 192.168.0.10
    access:
      preferred: proxmox-api
      fallback: ssh
      credential_ref: proxmox-readonly
    risks:
      - runs-vms
      - storage-attached
services:
  - id: jellyfin
    kind: media
    runs_on: pve-01
    exposure: tailnet-only
storage:
  - id: media-nas
    kind: nas
    mounted_by:
      - pve-01
    backup_status: unknown
networks:
  remote_access:
    tailnet: true
    public_ingress: false
  outbound_privacy:
    vpn_provider: unset
agents:
  - id: local-agent
    kind: openclaw-or-hermes
    status: unknown
    model_route_policy: guardrails/model-routing.example.yaml

